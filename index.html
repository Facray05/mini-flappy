<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flappy Box — Mini</title>
<style>
  :root {
    --bg: #e8f5ff;
    --sky: #bfe9ff;
    --player: #ffd54f; /* yellow */
    --pipe: #2e7d32;   /* green */
    --ui: #064663;
  }
  html,body {
    height:100%;
    margin:0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wrap {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  canvas {
    display:block;
    background: linear-gradient(#bde8ff, #e6f7ff);
    border: 3px solid #039be5;
    border-radius:8px;
    touch-action: none; /* allow touch events without scrolling on mobile */
  }
  .hud {
    position:relative;
    width: 400px;
    max-width: calc(100vw - 20px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:600;
    color:var(--ui);
  }
  .scorebox {
    background:rgba(255,255,255,0.85);
    padding:6px 10px;
    border-radius:6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    font-size:16px;
  }
  .controls {
    font-size:13px;
    color:#055160;
  }
  .overlay {
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .card {
    background:rgba(255,255,255,0.96);
    border-radius:8px;
    padding:14px 18px;
    box-shadow:0 6px 18px rgba(2,70,90,0.12);
    text-align:center;
    pointer-events:auto;
  }
  button {
    background:#0288d1;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
  }
  button:active { transform: translateY(1px); }
  @media (max-width:420px){
    canvas { width:92vw; height: 138vw; } /* keep aspect */
    .hud { width:92vw; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="scorebox" id="scorebox">Score: 0 | High: 0</div>
      <div class="controls">Click / Tap / Space to jump</div>
    </div>

    <!-- Canvas fixed logical size 400x600 -->
    <div style="position:relative;">
      <canvas id="game" width="400" height="600"></canvas>

      <!-- overlays (start + game over) -->
      <div class="overlay" id="overlay">
        <div class="card" id="overlayCard">
          <div id="overlayTitle" style="font-size:18px; margin-bottom:8px; color:#063b41;">Flappy Box</div>
          <div style="font-size:14px; margin-bottom:12px; color:#0b4f4f;">
            A simple flappy-like mini-game. Press Space / Click / Tap to jump.<br>
            Try to pass the green pipes — speed increases as you score.
          </div>
          <div style="display:flex; gap:8px; justify-content:center;">
            <button id="startBtn">Start Game</button>
            <button id="resetHigh" style="background:#9e9e9e">Reset High</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/*
  Flappy Box — single-file playable game.
  - Yellow square player
  - Green rectangular pipes
  - Score & Highscore (localStorage)
  - Controls: mouse click / touch / Space
  - Speed increases with score
  - Works by opening this HTML file in any modern browser
*/

// Canvas & context
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// UI elements
const scorebox = document.getElementById('scorebox');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const overlayTitle = document.getElementById('overlayTitle');
const resetHigh = document.getElementById('resetHigh');

const W = canvas.width;   // 400
const H = canvas.height;  // 600

// Game config (tweak here)
const BASE = {
  gravity: 0.65,
  jumpVelocity: -10.5,
  pipeWidth: 60,
  initialSpeed: 2.0,      // base pipe speed (slow at first)
  speedPerScore: 0.25,    // additional speed per score point
  spawnInterval: 1500,    // ms between pipes
  baseGap: 150,           // initial vertical gap
  gapReductionPerScore: 2,// gap shrinks gradually as score increases
  maxGapReduction: 60,    // don't remove too much gap
  minSpawnInterval: 900,  // optional: could make spawn faster; unused currently
};

let state = {
  player: null,
  pipes: [],
  running: false,
  lastSpawnTime: 0,
  score: 0,
  high: 0,
  lastTime: 0,
  speed: BASE.initialSpeed
};

// localStorage key
const HS_KEY = 'flappy_box_high_v1';

// helper: reset state
function resetState() {
  state.player = {
    x: 60,
    y: H/2 - 15,
    w: 36,
    h: 36,
    vy: 0
  };
  state.pipes = [];
  state.running = false;
  state.lastSpawnTime = performance.now();
  state.score = 0;
  state.high = Number(localStorage.getItem(HS_KEY) || 0);
  state.lastTime = performance.now();
  state.speed = BASE.initialSpeed;
  updateScoreUI();
}

// UI update
function updateScoreUI() {
  scorebox.textContent = `Score: ${state.score} | High: ${state.high}`;
}

// spawn one pipe (pair)
function spawnPipe() {
  const maxTop = H - BASE.baseGap - 130;
  // ensure top pipe has at least 50px height and leave space for gap
  const topH = 50 + Math.random() * Math.max(1, maxTop - 50);
  const gapReduction = Math.min(state.score * BASE.gapReductionPerScore, BASE.maxGapReduction);
  const gap = BASE.baseGap - gapReduction;

  // Ensure minimum horizontal distance between pipes
  const minPipeDistance = 150; // Set your desired minimum distance here
  let pipeX = W + 10;
  if (state.pipes.length > 0) {
    const lastPipe = state.pipes[state.pipes.length - 1];
    pipeX = lastPipe.x + lastPipe.w + minPipeDistance;
  }

  state.pipes.push({
    x: pipeX,
    w: BASE.pipeWidth,
    topH: Math.round(topH),
    gap: Math.round(gap),
    passed: false
  });
}


// collision AABB
function rectOverlap(a, b) {
  return !(a.x + a.w <= b.x || a.x >= b.x + b.w || a.y + a.h <= b.y || a.y >= b.y + b.h);
}

// check all collisions
function checkCollision() {
  // ceiling/floor
  if (state.player.y < 0 || state.player.y + state.player.h > H) return true;
  // pipes
  for (const p of state.pipes) {
    const topRect = { x: p.x, y: 0, w: p.w, h: p.topH };
    const botRect = { x: p.x, y: p.topH + p.gap, w: p.w, h: H - (p.topH + p.gap) };
    if (rectOverlap(state.player, topRect) || rectOverlap(state.player, botRect)) return true;
  }
  return false;
}

// input: jump
function jump() {
  if (!state.running) {
    startGame();
    return;
  }
  state.player.vy = BASE.jumpVelocity;
}

// game start
function startGame() {
  state.running = true;
  state.pipes = [];
  state.lastSpawnTime = performance.now();
  state.lastTime = performance.now();
  state.score = 0;
  state.speed = BASE.initialSpeed;
  updateScoreUI();
  overlay.style.pointerEvents = 'none';
  overlay.style.opacity = 0;
  overlayCardHide();
  requestAnimationFrame(loop);
}

// show overlay card (for start/gameover)
function overlayCardShow(text, buttonText='Restart') {
  overlay.style.pointerEvents = 'auto';
  overlay.style.opacity = 1;
  overlayTitle.textContent = text;
  startBtn.textContent = buttonText;
  overlay.style.display = 'flex';
}
function overlayCardHide(){
  // keep overlay in DOM but hide visually (pointer-events none done in start)
  overlay.style.display = 'flex';
  overlay.style.opacity = 0;
}

// main loop
function loop(now) {
  if (!state.running) return;
  const dt = Math.min(40, now - state.lastTime); // cap delta to avoid huge jumps
  state.lastTime = now;

  // physics update: apply gravity
  state.player.vy += BASE.gravity * (dt / 16.67); // normalize to 60fps frame
  state.player.y += state.player.vy * (dt / 16.67);

  // spawn pipes on interval
  if (now - state.lastSpawnTime > BASE.spawnInterval) {
    spawnPipe();
    state.lastSpawnTime = now;
  }

  // update speed according to score
  state.speed = BASE.initialSpeed + state.score * BASE.speedPerScore;

  // move pipes
  for (let i = state.pipes.length - 1; i >= 0; i--) {
    const p = state.pipes[i];
    p.x -= state.speed * (dt / 16.67);
    // score when pipe passed player
    if (!p.passed && p.x + p.w < state.player.x) {
      p.passed = true;
      state.score += 1;
      // every score increment immediately increases speed (handled above next frame)
      // update UI
      if (state.score > state.high) {
        // provisional high shown; saved on gameover
        updateScoreUI();
      } else {
        updateScoreUI();
      }
    }
    // remove offscreen
    if (p.x + p.w < -10) state.pipes.splice(i, 1);
  }

  // collision check
  if (checkCollision()) {
    gameOver();
    return;
  }

  // render
  draw();

  // next frame
  requestAnimationFrame(loop);
}

// draw everything
function draw() {
  // clear
  ctx.clearRect(0,0,W,H);

  // background gradient (simple sky + ground hint)
  // ground band
  ctx.fillStyle = '#c7f2d6';
  ctx.fillRect(0, H - 60, W, 60);

  // draw pipes (green rectangles)
  for (const p of state.pipes) {
    ctx.fillStyle = '#2e7d32';
    // top
    ctx.fillRect(Math.round(p.x), 0, p.w, p.topH);
    // bottom
    ctx.fillRect(Math.round(p.x), p.topH + p.gap, p.w, H - (p.topH + p.gap));
  }

  // draw player (yellow square with subtle border)
  ctx.fillStyle = '#ffd54f';
  ctx.fillRect(state.player.x, state.player.y, state.player.w, state.player.h);
  ctx.strokeStyle = '#b27f1f';
  ctx.lineWidth = 2;
  ctx.strokeRect(state.player.x, state.player.y, state.player.w, state.player.h);

  // optional: small shadow below player
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(state.player.x+6, state.player.y + state.player.h + 6, state.player.w - 12, 4);

  // small speed indicator (for feedback)
  ctx.fillStyle = '#064663';
  ctx.font = '12px system-ui, Arial';
  ctx.fillText('spd: ' + (state.speed).toFixed(2), 8, H - 10);

  // update score UI (DOM)
  updateScoreUI();
}

// game over
function gameOver() {
  state.running = false;
  // save highscore
  if (state.score > state.high) {
    state.high = state.score;
    localStorage.setItem(HS_KEY, String(state.high));
  }
  updateScoreUI();
  // show overlay with result
  overlay.style.pointerEvents = 'auto';
  overlay.style.opacity = 1;
  overlayTitle.textContent = `Game Over — Score ${state.score}`;
  startBtn.textContent = 'Restart';
  overlayCardShow(overlayTitle.textContent, 'Restart');
}

// initial setup
resetState();
overlay.style.opacity = 1;

// event listeners for controls
// mouse / pointer / touch
canvas.addEventListener('mousedown', (e) => { e.preventDefault(); jump(); });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, {passive:false});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    jump();
  }
});

// start button
startBtn.addEventListener('click', () => {
  // hide overlay and start
  overlay.style.pointerEvents = 'none';
  overlay.style.opacity = 0;
  startGame();
});

// reset highscore
resetHigh.addEventListener('click', ()=>{
  localStorage.removeItem(HS_KEY);
  state.high = 0;
  updateScoreUI();
});

// optional: clicking overlay outside card also starts
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) {
    startGame();
  }
});

// prevent double-tap zoom on mobile interfering with canvas
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const t = Date.now();
  if (t - lastTouch <= 300) e.preventDefault(); // double tap
  lastTouch = t;
}, {passive:false});

</script>
</body>
</html>
